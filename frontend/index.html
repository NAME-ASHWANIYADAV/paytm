<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#00B9F1" />
    <meta
      name="description"
      content="MunshiJi — voice-first AI munim for Indian merchants. Dukaan, khata and a copilot that acts."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon-mu.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Text + Devanagari: IBM Plex Sans / IBM Plex Sans Devanagari — a metrically matched pair,
      which is why the bilingual UI never jitters between scripts. Numerals: IBM Plex Mono.
      If the venue Wi-Fi eats this request the CSS stacks fall back to Nirmala UI / Noto Sans
      Devanagari, which are present on the demo machines.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Devanagari:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>MunshiJi</title>
    <!--
      Theme is decided before first paint, not by whichever component happens to mount: light
      is the brand's face, dark only if the merchant chose it earlier. Without this, the login
      screen (which renders before any theme hook) follows the OS into dark.
    -->
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('munshiji.theme') === 'dark' ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
